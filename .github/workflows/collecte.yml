# Collecte automatique des prix, 24 h/24, gratuitement.
#
# POURQUOI CE FICHIER EXISTE
# --------------------------
# Le seul moyen d'obtenir un vrai historique de prix, c'est de relever les prix
# régulièrement pendant des semaines. Sur une machine personnelle il faudrait la
# laisser allumée en permanence ; GitHub le fait gratuitement.
#
# CADENCE : ce dépôt est PRIVÉ, donc le quota gratuit est de 2 000 minutes par
# mois. Le calcul décide de tout :
#
#   12 h × 25 min = 2 passages/jour = 1 500 min/mois   (ancienne cadence)
#    6 h × 15 min = 4 passages/jour = 1 800 min/mois   (celle-ci)
#
# Même quota, DEUX FOIS plus de relevés. C'est la répétition qui construit
# l'historique, pas la durée d'un passage isolé : quatre relevés par jour
# datent un changement de prix à six heures près, contre douze auparavant.
#
# Le budget plus court impose en revanche de le répartir : dix magasins en
# quinze minutes, ce serait toujours le premier servi et jamais le dernier.
# `ci-cycle` fait donc tourner l'ordre de passage d'un cycle à l'autre.
#
# Sur un dépôt public, Actions est illimité : une cadence de 2 h deviendrait
# possible en changeant la seule ligne `cron` ci-dessous.
#
# OÙ VIT LA BASE
# --------------
# Pas dans le dépôt Git : elle grossit à chaque cycle et GitHub refuse les
# fichiers de plus de 100 Mo. Elle est stockée comme **asset de release**
# (jusqu'à 2 Go, gratuit), téléchargée au début du job et re-téléversée à la
# fin. La release `db` sert de conteneur permanent.

name: Collecte des prix

on:
  schedule:
    # Toutes les 6 heures. GitHub planifie en UTC et peut décaler de quelques
    # minutes en période de charge : sans importance ici, on veut de la
    # régularité, pas de la précision.
    - cron: '0 */6 * * *'
  # Permet de déclencher un cycle à la main depuis l'onglet Actions.
  workflow_dispatch:

# Un seul cycle à la fois : deux jobs concurrents écriraient la même base et le
# dernier à finir écraserait le travail de l'autre.
concurrency:
  group: collecte
  cancel-in-progress: false

permissions:
  contents: write # nécessaire pour téléverser la base sur la release

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Récupérer la base existante
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data

          # Première exécution : la release n'existe pas encore, on la crée.
          if ! gh release view db >/dev/null 2>&1; then
            gh release create db --title "Base de données"               --notes "Base SQLite de collecte. Remplacée à chaque cycle."
          fi

          # UN ÉCHEC DE TÉLÉCHARGEMENT DOIT ARRÊTER LE CYCLE.
          #
          # La version précédente se terminait par « || echo démarrage à vide »,
          # ce qui avalait TOUTE erreur — réseau, jeton expiré, quota dépassé.
          # Le cycle repartait alors d'une base neuve, la remplissait de ce
          # qu'il pouvait en quinze minutes, puis ÉCRASAIT la vraie sur la
          # release. Un incident passager suffisait à effacer des semaines
          # d'historique de prix, sans un mot dans le journal.
          #
          # Seul le cas « aucune base publiée » est légitime, et il ne se
          # produit qu'au tout premier cycle : on le distingue explicitement.
          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd

          publiees=$(gh release view db --json assets --jq '.assets[].name')
          if echo "$publiees" | grep -qx 'itemfinder.db.zst'; then
            gh release download db --pattern 'itemfinder.db.zst' --dir data --clobber
            zstd -d -f data/itemfinder.db.zst -o data/itemfinder.db
            rm -f data/itemfinder.db.zst
          elif echo "$publiees" | grep -qx 'itemfinder.db'; then
            # Ancien format, non compressé : accepté, puis remplacé par la
            # version compressée dès le premier archivage.
            gh release download db --pattern 'itemfinder.db' --dir data --clobber
          else
            echo "Aucune base publiée — premier cycle, elle sera créée de zéro."
          fi
          ls -lh data/ || true

      # L'empreinte d'AVANT sert de témoin : elle seule permet de dire, après
      # coup, si la base archivée est bien la continuation de la précédente.
      - name: Relever l'empreinte de départ
        id: avant
        run: echo "empreinte=$(npx tsx scripts/garde-base.ts empreinte)" >> "$GITHUB_OUTPUT"

      - name: Cycle de collecte
        run: npm run ci:cycle -- --minutes 15

      # Perdre un cycle est réparable ; écraser la release avec une base qui a
      # fondu ne l'est pas.
      - name: Vérifier que la base n'a pas fondu
        run: npx tsx scripts/garde-base.ts verifier '${{ steps.avant.outputs.empreinte }}'

      - name: Archiver la base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd

          # La base est surtout du texte : mesuré sur le fichier réel, 951 Mo
          # tombent à environ 210 Mo — un facteur 4,5. Autant de temps de
          # transfert en moins à chaque cycle, et de la marge sous le plafond
          # de 2 Go des assets de release, que la base atteindrait sinon.
          zstd -9 -T0 -f data/itemfinder.db -o data/itemfinder.db.zst
          ls -lh data/itemfinder.db data/itemfinder.db.zst
          gh release upload db data/itemfinder.db.zst --clobber

      - name: Publier le tableau de bord
        run: npm run stores >> "$GITHUB_STEP_SUMMARY"

      # Les workflows planifiés sont désactivés après 60 jours sans activité sur
      # le dépôt. Ce commit trivial garde la collecte en vie.
      - name: Marquer l'activité du dépôt
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/derniere-collecte
          git config user.name "collecte"
          git config user.email "collecte@users.noreply.github.com"
          git add .github/derniere-collecte
          git diff --staged --quiet || git commit -m "collecte: cycle terminé"
          git push
